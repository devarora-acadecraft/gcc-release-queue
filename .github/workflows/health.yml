name: health

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 release.py --health
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
