name: patch

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'client repo'
        required: true
        type: choice
        options: [gcc-api, gcc-web, gcc-super-admin]
      patch:
        description: 'patch file in this repo, e.g. patches/x.patch'
        required: true
        type: string
      branch:
        description: 'client branch to create'
        required: true
        type: string
      title:
        description: 'title for the new PR'
        required: true
        type: string
      mode:
        description: 'report (pushes nothing) or apply'
        required: true
        default: report
        type: choice
        options: [report, apply]
      new_pr:
        description: 'open its own PR even if a developer671 PR is open on the base'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - run: python3 patch.py "$REPO" "$PATCH" "$BRANCH" "$TITLE" "$MODE" "$NEW_PR"
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
          PATCH_KEY: ${{ secrets.PATCH_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          PATCH: ${{ inputs.patch }}
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ inputs.title }}
          MODE: ${{ inputs.mode }}
          NEW_PR: ${{ inputs.new_pr && 'new-pr' || '' }}
