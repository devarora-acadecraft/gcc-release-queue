name: retarget

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report (changes nothing) or apply'
        required: true
        default: report
        type: choice
        options: [report, apply]
      to:
        description: 'branch the PRs should target'
        required: true
        default: master
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  retarget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - run: python3 retarget.py "${{ inputs.mode }}"
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RETARGET_TO: ${{ inputs.to }}
